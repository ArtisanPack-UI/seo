name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPCS
        run: ./vendor/bin/phpcs src/ config/ routes/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test (PHP ${{ matrix.php }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11.*'
            with-ai: false
          - php: '8.2'
            laravel: '12.*'
            with-ai: false
          - php: '8.3'
            laravel: '11.*'
            with-ai: false
          - php: '8.3'
            laravel: '12.*'
            with-ai: true
          - php: '8.3'
            laravel: '13.*'
            with-ai: true
          - php: '8.4'
            laravel: '12.*'
            with-ai: true
          - php: '8.4'
            laravel: '13.*'
            with-ai: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      # artisanpack-ui/ai requires PHP 8.3+ and Laravel 12+, so drop it from
      # composer.json on the PHP 8.2 job before resolving deps. The SEO
      # package's AI Feature Suite is optional at runtime; downstream users
      # on PHP 8.2 get the rest of the package normally.
      - name: Remove AI dev dep (PHP 8.2)
        if: matrix.with-ai == false
        run: composer remove artisanpack-ui/ai --dev --no-update

      - name: Pin Laravel version for matrix
        run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Unit tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --testsuite=Unit --no-coverage

      - name: Run Feature tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --testsuite=Feature --no-coverage

      - name: Run AI tests
        if: matrix.with-ai
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --testsuite=Ai --no-coverage
